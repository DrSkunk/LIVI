[package]
name = "livi-music-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
futures-util = { workspace = true, features = ["sink"] }
getrandom = "0.3.4"
rustix = { version = "1.1.6", features = ["fs"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
webrtc = "0.17.3"
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.13.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "aws_lc_rs", "std", "tls12"] }
tempfile = "3"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
